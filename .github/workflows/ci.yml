name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチで新しい push があったら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト・Expo チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: テスト
        run: npm test -- --ci

      # Expo のパッチ版が公開されるたびにバージョン差分で失敗するため、
      # 失敗しても CI 全体は落とさず警告として表示する（直すときは `npx expo install --fix`）
      - name: Expo の依存関係・設定チェック
        continue-on-error: true
        run: |
          if ! npx expo-doctor@latest; then
            echo "::warning title=expo-doctor::Expo の依存関係に差分があります。npx expo install --fix で更新してください"
            exit 1
          fi

  docker:
    name: Docker イメージのビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: 開発用イメージをビルド
        run: docker build -t sofa-app-dev .
