name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチで新しい push があったら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト・Expo チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: テスト
        run: npm test -- --ci

      - name: Expo の依存関係・設定チェック
        run: npx expo-doctor@latest

  docker:
    name: Docker イメージのビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: 開発用イメージをビルド
        run: docker build -t sofa-app-dev .
